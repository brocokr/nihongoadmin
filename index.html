<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%2228%22%20y%3D%2234%22%20width%3D%228%22%20height%3D%2224%22%20rx%3D%224%22%20fill%3D%22%235d8a3a%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2228%22%20r%3D%2213%22%20fill%3D%22%232e7d32%22/%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2228%22%20r%3D%2213%22%20fill%3D%22%232e7d32%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2218%22%20r%3D%2214%22%20fill%3D%22%2343a047%22/%3E%3C/svg%3E">
<title>broco Nihongo 운영 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky console bar (brand · data source · tabs) over one 1180px work column; panels in auto-fit grids that stack at phone width */
:root{
  --bg:#eef4ec; --surface:#ffffff; --ink:#1b2a1e; --muted:#5a6d5e; --line:#d2e0d0; --soft:#f5f9f4;
  --accent:#2e7d32; --accent-soft:#dcefd8; --good:#11796b; --good-soft:#d5f0ea; --bad:#b2414f; --bad-soft:#f8e1e4;
  --sun:#9a5b00; --sun-soft:#fbedd2; --plum:#7a3e8e; --plum-soft:#f1e3f6; --top:#a3324a; --top-soft:#f7e0e5; --shade:rgba(6,14,8,.5);
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-brand:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1611; --surface:#17231a; --ink:#e5efe6; --muted:#95a999; --line:#29392d; --soft:#122016;
  --accent:#7ed389; --accent-soft:#1d3a23; --good:#5fd0bc; --good-soft:#12342e; --bad:#ff8f9c; --bad-soft:#43202a;
  --sun:#e8b45c; --sun-soft:#3b2d15; --plum:#d9a6ec; --plum-soft:#3a2347; --top:#ff9db0; --top-soft:#45202a; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1611; --surface:#17231a; --ink:#e5efe6; --muted:#95a999; --line:#29392d; --soft:#122016;
  --accent:#7ed389; --accent-soft:#1d3a23; --good:#5fd0bc; --good-soft:#12342e; --bad:#ff8f9c; --bad-soft:#43202a;
  --sun:#e8b45c; --sun-soft:#3b2d15; --plum:#d9a6ec; --plum-soft:#3a2347; --top:#ff9db0; --top-soft:#45202a; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h2{margin:0;font-size:16px;text-wrap:balance}
h3{margin:0;font-size:14.5px}

/* console bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in,.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-brand);font-size:19px;white-space:nowrap}
.brand b span{color:var(--accent)}
.brand small{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--sun-soft);color:var(--sun)}
.src.live{background:var(--good-soft);color:var(--good)}
.src i{width:7px;height:7px;border-radius:50%;background:currentColor}
.me{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.btn{border:0;background:var(--accent);color:var(--bg);font-weight:700;padding:9px 14px;border-radius:10px;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:var(--bg)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:2px;overflow-x:auto;width:100%;margin-top:4px;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 12px 11px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--line);color:var(--ink)}
.badge.hot{background:var(--bad);color:var(--bg)}

.wrap{padding-block:18px 56px;display:flex;flex-direction:column;gap:14px}
.demo{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);border-radius:12px;padding:10px 14px;font-size:13px}
.demo b{color:var(--sun)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ph p{margin:0;font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px}
.grid-side{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:900px){.grid-side{grid-template-columns:minmax(0,1fr)}}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-l{font-size:12.5px;font-weight:700;color:var(--muted)}
.kpi-v{font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi-v small{font-size:16px;margin-left:2px;color:var(--muted)}
.kpi-s{font-size:12.5px;color:var(--muted)}
.kpi-d{margin:6px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--sun-soft);color:var(--sun)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--soft);color:var(--muted);border:1px solid var(--line)}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .val{fill:var(--ink);font-weight:700}
.chart .bar{fill:var(--accent)}
.chart .hit{fill:transparent}
.chart .hit:hover+.bar,.chart g.on .bar{opacity:.8}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:118px minmax(0,1fr) 68px;align-items:center;gap:10px;font-size:13px}
.hb-l{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.hb-l small{font-size:11px;color:var(--muted)}
.hb-t{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--lc,var(--accent))}
.hb-n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-n small{font-size:11px}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.45;max-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
details.tv summary{font-size:12px;color:var(--muted);cursor:pointer}
details.tv table{margin-top:6px}

/* stage colors (same as the learner app) */
[data-l="kana"]{--lc:var(--good);--ls:var(--good-soft)}
[data-l="beg"]{--lc:var(--sun);--ls:var(--sun-soft)}
[data-l="mid"]{--lc:var(--accent);--ls:var(--accent-soft)}
[data-l="adv"]{--lc:var(--plum);--ls:var(--plum-soft)}
[data-l="top"]{--lc:var(--top);--ls:var(--top-soft)}
.stg{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--ls);color:var(--lc);white-space:nowrap}

/* lists + tables */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1 1 200px;min-width:0}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;min-width:0}
textarea{width:100%;min-height:76px;resize:vertical}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--soft)}
.who{display:flex;flex-direction:column;line-height:1.3}
.who small{color:var(--muted);font-size:12px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.risk{display:flex;flex-direction:column}
.risk button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;border:0;background:none;border-bottom:1px solid var(--line);padding:10px 2px}
.risk button:last-child{border-bottom:0}
.risk .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}

/* Q&A */
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qlist{display:flex;flex-direction:column;gap:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.q.late{border-color:var(--bad)}
.qh{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.qh b{color:var(--ink);font-size:13.5px}
.qt{margin:0;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ref{font-size:12.5px;background:var(--soft);border-radius:8px;padding:5px 9px;align-self:flex-start;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.st-wait{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.st-assigned{background:var(--accent-soft);color:var(--accent)}
.st-late{background:var(--bad);color:var(--bg)}
.st-done{background:var(--good-soft);color:var(--good)}
.st-cancel{background:var(--soft);color:var(--muted);text-decoration:line-through}
.ans{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px;white-space:pre-wrap;word-break:break-word}
.ans b{font-size:12.5px;color:var(--good)}
.qa-act{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-size:12.5px;margin:0}
.flag{font-size:12.5px;font-weight:700;color:var(--bad)}
.tutor{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.tutor:last-child{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.on{background:var(--good)}
.rules{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* notice editor */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700}
.field small{font-size:11.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.phone{background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;max-width:380px}
.phone .ph-h{font-family:var(--f-brand);font-size:18px}
.phone .ph-h span{color:var(--accent)}
.notice{display:flex;gap:8px;align-items:flex-start;background:var(--sun-soft);border-radius:12px;padding:9px 12px;font-size:13px}
.notice svg{color:var(--sun);flex:none;margin-top:2px}
.qab{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:14px;padding:9px 12px}
.qab .qi{width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;flex:none}
.qab .qt2{flex:1;min-width:0;display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.qab .qt2 b{font-size:13.5px;color:var(--ink)}
.qab .go{flex:none;font-size:12px;font-weight:700;color:var(--surface);background:var(--accent);border-radius:999px;padding:6px 11px}

/* drawer + dialogs */
.dbg{position:fixed;inset:0;z-index:30;background:var(--shade);display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(480px,100%);height:100%;overflow:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:6px 8px;margin:-6px -8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mini{display:flex;align-items:flex-end;gap:3px;height:54px}
.mini i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.mini i.z{background:var(--line)}
.mini-x{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* gate */
.gate{min-height:70vh;display:grid;place-items:center;padding:24px 0}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 22px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:2.4s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:50;max-width:calc(100% - 32px)}
@media (max-width:560px){
  .kpi-v{font-size:26px}
  .hb{grid-template-columns:92px minmax(0,1fr) 62px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .me span{max-width:130px}
}
</style>
<style>html,body{margin:0}</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="brand"><b>broco <span>Nihongo</span></b><small>운영 콘솔</small></div>
    <a class="btn ghost sm applink" id="appLink" href="https://brocokr.github.io/nihongo/" target="_blank" rel="noopener">학습 앱 열기</a>
    <span class="src" id="src"><i></i>데모 데이터</span>
    <div class="me" id="me" hidden></div>
    <button class="btn ghost sm" id="refresh">새로고침</button>
    <nav class="tabs" id="tabs" aria-label="관리 메뉴"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="tip" id="tip" hidden></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="firebase-config.js"></script>
<script>
/* ---------- settings: firebase-config.js (shared with index.html) supplies these on GitHub ---------- */
const CFG=Object.assign({apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""},window.BROCCOLI_FIREBASE||{});
const ADMINS=(window.BROCCOLI_ADMINS||[]).map(s=>String(s).trim().toLowerCase()).filter(Boolean);
const LIVE=!!(CFG.apiKey&&CFG.projectId),FB_VER="10.12.2";

/* ---------- shared rules with the learner app ---------- */
const TIERS=["kana","beg","mid","adv","top"],TIER_START={kana:1,beg:5,mid:20,adv:100,top:200};
const STAGE={kana:{name:"히라가나",range:"Lv.1–4"},beg:{name:"입문",range:"Lv.5–19"},mid:{name:"기초",range:"Lv.20–99"},adv:{name:"상급",range:"Lv.100–199"},top:{name:"최상급",range:"Lv.200+"}};
const RANKS=[["아이언",1],["브론즈",5],["실버",11],["골드",21],["플래티넘",41],["다이아몬드",71],["마스터",100],["챌린저",200]];
const xpFor=L=>Math.round(10*(L-1)+.5*(L-1)*(L-1));
const lvOf=x=>{let L=1;while(xpFor(L+1)<=x)L++;return L};
const tierOf=L=>L>=200?"top":L>=100?"adv":L>=20?"mid":L>=5?"beg":"kana";
const rankOf=L=>{let r=RANKS[0][0];RANKS.forEach(([n,m])=>{if(L>=m)r=n});return r};
const TUTORS=[{id:"T-01",name:"하윤 선배",tag:"N1 · 오사카 교환학생 1년",spec:["문법","뜻·뉘앙스"]},{id:"T-02",name:"민재 선배",tag:"N1 · 도쿄 거주",spec:["애니·J-POP 표현","뜻·뉘앙스"]},{id:"T-03",name:"사토 씨",tag:"일본인 교환학생",spec:["읽기·발음","기타"]}];

/* ---------- learner summary: the same numbers for demo and live data ---------- */
function summarize(id,d){
  const J=k=>{const v=d.data&&d.data[k];if(v==null)return null;try{return JSON.parse(v)}catch(e){return null}};
  const xp=typeof d.xp==="number"?d.xp:(+J("xp")||0),L=lvOf(xp),log=J("log")||{},goal=+J("goal")||20,t0=day0(Date.now());
  const days=Object.entries(log).map(([k,v])=>({t:parseD(k),v})).filter(x=>x.t&&dayTot(x.v)>0).sort((a,b)=>a.t-b.t);
  const w7=days.filter(x=>x.t>t0-7*DAY),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
  const st=J("streak"),stLast=st&&parseD(st.last),wr=J("wrong");
  return {id,raw:d,name:d.name||(d.email||"").split("@")[0]||"이름 없음",email:d.email||"",xp,L,rank:rankOf(L),tier:tierOf(L),goal,
    days,first:days.length?days[0].t:null,last:days.length?days[days.length-1].t:null,updatedAt:d.updatedAt||0,
    w7days:w7.length,w7n:sum(w7,x=>dayTot(x.v)),w7q:sum(w7,x=>x.v.q||0),w7qc:sum(w7,x=>x.v.qc||0),w7s:sum(w7,x=>x.v.s||0),w7goal:w7.filter(x=>dayTot(x.v)>=goal).length,
    allc:sum(days,x=>x.v.c||0),allq:sum(days,x=>x.v.q||0),allqc:sum(days,x=>x.v.qc||0),alls:sum(days,x=>x.v.s||0),
    streak:st&&stLast&&t0-stLast<=DAY?st.n||0:0,diag:J("diag"),track:J("track")||"talk",target:J("target"),
    wrongN:wr?Object.keys(wr.q||{}).length+Object.keys(wr.c||{}).length:0,reset:d.data&&d.data._reset!=null,adminEdit:d.adminEdit||null};
}
function rebuild(){S.rows=S.users.map(u=>summarize(u.id,u.d));S.refreshedAt=Date.now()}

/* ---------- KPIs (definitions double as the report's 성과지표) ---------- */
function kpis(){
  const R=S.rows,N=R.length,t0=day0(Date.now());
  const wau=R.filter(r=>r.w7days>0).length;
  const elig=R.filter(r=>r.first&&r.first<=t0-7*DAY),ret=elig.filter(r=>r.days.some(x=>x.t>r.first&&x.t<=r.first+7*DAY)).length;
  const q=R.reduce((s,r)=>s+r.w7q,0),qc=R.reduce((s,r)=>s+r.w7qc,0);
  const ad=R.reduce((s,r)=>s+r.w7days,0),ag=R.reduce((s,r)=>s+r.w7goal,0);
  const done=S.qs.filter(x=>x.status==="done"&&x.answeredAt&&x.answeredAt>Date.now()-30*DAY),fast=done.filter(x=>x.answeredAt-x.created<=SLA).length;
  const rated=done.filter(x=>x.rating),good=rated.filter(x=>x.rating==="good").length,avg=done.length?done.reduce((s,x)=>s+(x.answeredAt-x.created),0)/done.length:0;
  return [
    {k:"wau",l:"주간 활성 학습자",v:pct(wau,N),u:"%",s:`${wau} / ${N}명이 최근 7일에 공부했어요`,goal:60,d:"최근 7일 안에 카드·퀴즈·쓰기를 1개 이상 한 학습자 ÷ 전체 학습자. 목표 60% (매일 쓰는 습관형 서비스 기준)"},
    {k:"ret",l:"7일 재방문율",v:pct(ret,elig.length),u:"%",s:elig.length?`첫 학습 후 7일 안에 다시 온 사람 ${ret} / ${elig.length}명`:"첫 학습 후 7일이 지난 학습자가 아직 없어요",goal:40,d:"첫 학습일이 7일 넘게 지난 학습자 중, 첫날 다음 7일 안에 다시 공부한 비율. 목표 40%"},
    {k:"acc",l:"퀴즈 정답률",v:pct(qc,q),u:"%",s:`최근 7일 ${qc.toLocaleString()} / ${q.toLocaleString()}문제`,band:[70,85],d:"최근 7일 맞힌 퀴즈 ÷ 푼 퀴즈. 70~85%면 레벨 난이도가 알맞다고 봐요. 낮으면 어렵고, 높으면 쉬워요"},
    {k:"goal",l:"하루 목표 달성률",v:pct(ag,ad),u:"%",s:`최근 7일 공부한 ${ad}일 중 ${ag}일 달성`,goal:50,d:"최근 7일 동안 공부한 날 중 하루 목표(기본 20개)를 채운 날의 비율. 목표 50%"},
    {k:"sla",l:"2시간 내 답변율",v:pct(fast,done.length),u:"%",s:done.length?`평균 ${dur(avg)} · 해결률 ${rated.length?pct(good,rated.length)+"%":"–"}`:"최근 30일 답변한 질문이 없어요",goal:90,d:"최근 30일 답변 완료 질문 중 접수부터 답변까지 2시간 이내인 비율. 목표 90%. 해결률은 ‘도움 됐어요’ ÷ 평가한 답변"}
  ];
}
function kpiChip(k){
  if(k.v==null)return `<span class="chip mute">대상 없음</span>`;
  if(k.band){const [a,b]=k.band;return k.v<a?`<span class="chip warn">${WARN} 어려움 · 기준 ${a}~${b}%</span>`:k.v>b?`<span class="chip warn">${WARN} 쉬움 · 기준 ${a}~${b}%</span>`:`<span class="chip ok">${OK} 알맞음 · 기준 ${a}~${b}%</span>`}
  return k.v>=k.goal?`<span class="chip ok">${OK} 목표 ${k.goal}% 달성</span>`:`<span class="chip bad">${WARN} 목표 ${k.goal}% 미달</span>`;
}

/* ---------- charts ---------- */
function dailySeries(n){
  const t0=day0(Date.now()),out=[];
  for(let i=n-1;i>=0;i--){const t=t0-i*DAY,k=dstr(new Date(t));let a=0,c=0,q=0;
    S.rows.forEach(r=>{const v=(r.days.find(x=>x.t===t)||{}).v;if(v&&dayTot(v)>0){a++;c+=v.c||0;q+=v.q||0}});out.push({t,a,c,q})}
  return out;
}
function niceMax(m){if(m<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(m))),s=[1,2,2.5,5,10].map(x=>x*p).find(x=>m/x<=4)||10*p;return Math.ceil(m/s)*s}
function barChart(data,W){
  W=Math.max(300,Math.min(680,Math.round(W||600)));const H=W<420?200:190,ml=30,mr=6,mt=16,mb=24,iw=W-ml-mr,ih=H-mt-mb,max=niceMax(Math.max(1,...data.map(d=>d.a))),bw=iw/data.length,w=Math.min(26,bw*.62);
  const y=v=>mt+ih-v/max*ih,ticks=[0,max/4,max/2,max*3/4,max].filter(v=>Number.isInteger(v));
  const bar=(x,v)=>{const h=Math.max(v?2:0,ih-(y(v)-mt)),top=mt+ih-h,r=Math.min(4,w/2,h);return h?`<path class="bar" d="M${x},${mt+ih}V${top+r}Q${x},${top} ${x+r},${top}H${x+w-r}Q${x+w},${top} ${x+w},${top+r}V${mt+ih}Z"/>`:""};
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 ${data.length}일 일별 학습자 수">
    <g class="grid">${ticks.map(v=>`<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}"/><text x="${ml-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("")}</g>
    ${data.map((d,i)=>{const x=ml+i*bw+(bw-w)/2;return `<g data-i="${i}"><rect class="hit" x="${ml+i*bw}" y="${mt}" width="${bw}" height="${ih+mb}"/>${bar(x,d.a)}${i===data.length-1?`<text class="val" x="${x+w/2}" y="${y(d.a)-5}" text-anchor="middle">${d.a}</text>`:""}${i%2===(data.length-1)%2?`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${md(d.t)}</text>`:""}</g>`}).join("")}
  </svg>`;
}
function bindTips(root,fn){
  const tip=$("tip");
  root.onmousemove=root.onclick=e=>{const g=e.target.closest("[data-i]");if(!g||!root.contains(g)){tip.hidden=true;return}
    tip.innerHTML=fn(+g.dataset.i);tip.hidden=false;const r=tip.getBoundingClientRect();
    tip.style.left=Math.min(innerWidth-r.width-8,Math.max(8,e.clientX-r.width/2))+"px";tip.style.top=Math.max(8,e.clientY-r.height-14)+"px"};
  root.onmouseleave=()=>{tip.hidden=true};
}
function hbars(items,total){
  const max=Math.max(1,...items.map(x=>x.n));
  return `<div class="hbars">${items.map((x,i)=>`<div class="hb" data-i="${i}"${x.l?` data-l="${x.l}"`:""}><span class="hb-l"><b>${esc(x.name)}</b>${x.sub?`<small>${esc(x.sub)}</small>`:""}</span><span class="hb-t"><i style="width:${x.n/max*100}%"></i></span><span class="hb-n">${x.n}${total?`<small class="muted"> ${pct(x.n,total)}%</small>`:""}</span></div>`).join("")}</div>`;
}

    ${r.adminEdit?`<p class="muted" style="margin:0;font-size:12px">${when(r.adminEdit.at)} ${esc(r.adminEdit.by||"관리자")}가 ${esc(r.adminEdit.what||"기록")}을(를) 바꿨어요.</p>`:""}

async function editUser(r,kind,L){
  const now=Date.now(),by=S.me?S.me.email:"데모 관리자",u=S.users.find(x=>x.id===r.id);if(!u)return;
  let d;
  if(kind==="level"){const x=xpFor(L);d=Object.assign({},u.d,{xp:x,lv:L,updatedAt:now,adminEdit:{at:now,by,what:`레벨(Lv.${r.L}→Lv.${L})`},data:Object.assign({},u.d.data,{xp:JSON.stringify(x)})})}
  else d={v:1,updatedAt:now,xp:0,lv:1,name:u.d.name||"",email:u.d.email||"",adminEdit:{at:now,by,what:"전체 기록 초기화"},data:{_reset:JSON.stringify("admin")}};
  try{
    /* level: patch only the changed fields so progress the learner saved meanwhile survives; reset: replace everything */
    if(S.mode==="live"){const {F,db}=S.fb,ref=F.doc(db,"users",r.id);
      if(kind==="level")await F.setDoc(ref,{xp:d.xp,lv:d.lv,updatedAt:now,adminEdit:d.adminEdit,data:{xp:d.data.xp}},{merge:true});else await F.setDoc(ref,d)}
    u.d=d;rebuild();S.confirm=null;drawUser();render();toast(kind==="level"?`${r.name}님을 Lv.${L}로 바꿨어요. 앱을 다시 열면 반영돼요.`:`${r.name}님의 기록을 초기화했어요.`);
  }catch(e){const er=$("dErr");if(er){er.textContent=fsErr(e);er.hidden=false}else toast(fsErr(e))}
}
function csvText(){

  const q=v=>{const s=String(v??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};

  return "﻿"+[H].concat(filteredRows().map(r=>[r.name,r.email,r.L,r.rank,STAGE[r.tier].name,r.xp,f(r.first),f(r.last),r.streak,r.w7n,pct(r.w7qc,r.w7q)??"",pct(r.allqc,r.allq)??"",r.wrongN,TRACK[r.track]||"",r.target||"",qCount(r.id)])).map(row=>row.map(q).join(",")).join("\n");

function stOf(q){return q.status==="done"?["st-done","답변 완료"]:q.status==="cancel"?["st-cancel","취소"]:isLate(q)?["st-late","지연"]:q.status==="assigned"?["st-assigned","배정됨"]:["st-wait","접수"]}

    </section>

        <li>‘아직 헷갈려요’ 평가가 붙은 답변은 같은 선배가 추가 질문을 이어서 맡아요.</li>

    </aside></div>`;

    ${q.status==="done"?`<div class="ans"><b>${t?t.name:"튜터"}의 답변 · ${dur(q.answeredAt-q.created)} 만에 답함${q.answeredBy?` · ${esc(q.answeredBy)}`:""}</b>${esc(q.answer)}</div><span>${q.rating==="good"?`<span class="chip ok">${OK} 도움 됐어요</span>`:q.rating==="bad"?`<span class="chip warn">${WARN} 아직 헷갈려요</span>`:`<span class="chip mute">평가 전</span>`}</span>`:""}
    ${q.status==="cancel"?`<span class="muted" style="font-size:12.5px">${q.cancelReason?`취소 사유: ${esc(q.cancelReason)}`:"학습자가 취소했어요."}</span>`:""}

}

    Q(2,{type:"뜻·뉘앙스",text:"「大丈夫です」가 거절하는 뜻이 될 때가 있나요?",created:now-30*h,status:"done",tutor:"T-01",assignedAt:now-30*h+3*m,answer:"네, 자주 있어요. 편의점에서 「袋はご利用ですか」(봉투 필요하세요?)라고 물을 때 「大丈夫です」라고 하면 ‘괜찮아요, 필요 없어요’라는 뜻이에요. 말끝을 부드럽게 올리고 가볍게 고개를 저으면 더 자연스러워요.",answeredAt:now-29.6*h,rating:"good"}),
    Q(0,{type:"문법",text:"「は」와 「が」 차이를 쉽게 설명해 주세요.",created:now-3*DAY,status:"done",tutor:"T-01",assignedAt:now-3*DAY+10*m,answer:"は는 ‘이야기의 주제’를, が는 ‘누가/무엇이’라는 새 정보를 가리켜요. 「誰が来ましたか」처럼 모르는 것을 물을 때와 그 답 「田中さんが来ました」에는 が를 써요. 「私は学生です」처럼 이미 아는 대상을 두고 설명할 때는 は예요.",answeredAt:now-3*DAY+48*m,rating:"bad"}),
    Q(13,{type:"애니·J-POP 표현",text:"「〜じゃん」은 어느 지역 말투예요?",created:now-4*DAY,status:"done",tutor:"T-02",assignedAt:now-4*DAY+2*m,answer:"원래 시즈오카·야마나시·가나가와 쪽 말투가 도쿄로 퍼진 것으로 알려져 있어요. 지금은 수도권 젊은 층이 흔히 쓰는 반말이라 친구 사이에서는 자연스럽지만, 윗사람에게는 쓰지 않아요.",answeredAt:now-4*DAY+27*m,rating:"good"}),
    Q(16,{type:"문법",text:"「食べられる」가 가능형이랑 수동형이 모양이 같은데 어떻게 구분해요?",created:now-5*DAY,status:"done",tutor:"T-01",assignedAt:now-5*DAY+20*m,answer:"문맥과 조사로 구분해요. 「刺身が食べられる」(회를 먹을 수 있다)처럼 대상에 が/を가 붙고 ‘할 수 있다’면 가능형이에요. 「犬にパンを食べられた」(개가 빵을 먹어 버렸다)처럼 ‘누구에게’ に가 있으면 수동형이에요.",answeredAt:now-5*DAY+3.2*h,rating:null}),
    Q(21,{type:"뜻·뉘앙스",text:"메일 끝에 「よろしくお願いいたします」 말고 다른 표현도 쓰나요?",created:now-6*DAY,status:"done",tutor:"T-01",assignedAt:now-6*DAY+4*m,answer:"상황에 따라 「引き続きよろしくお願いいたします」(계속 잘 부탁드립니다), 「ご確認のほど、よろしくお願いいたします」(확인 부탁드립니다), 더 격식을 차릴 땐 「何卒よろしくお願い申し上げます」를 써요.",answeredAt:now-6*DAY+38*m,rating:"good"}),
    Q(6,{type:"읽기·발음",text:"장음 표기 「おう」와 「おお」를 구분하는 규칙이 있나요?",created:now-7*DAY,status:"done",tutor:"T-03",assignedAt:now-7*DAY+6*m,answer:"대부분의 ‘오-’ 장음은 おう로 써요(おとうさん, こうこう). おお로 쓰는 건 おおきい, とおい, おおい, こおり, とおる처럼 정해진 단어들이라 묶어서 외우면 돼요.",answeredAt:now-7*DAY+1.6*h,rating:null}),
    Q(3,{type:"기타",text:"테스트로 보내 봐요",created:now-2*DAY,status:"cancel",cancelReason:"학습과 관계없는 질문"}),
    Q(19,{type:"문법",text:"「〜ものの」랑 「〜けれども」는 바꿔 써도 되나요?",created:now-2*DAY,status:"done",tutor:"T-01",assignedAt:now-2*DAY+9*m,answer:"뜻은 비슷하지만 〜ものの가 더 딱딱한 글말이에요. 일상 대화에서는 けど·けれども를, 보고서나 뉴스 같은 글에서는 ものの를 쓰면 자연스러워요. 〜ものの 뒤에는 보통 기대와 다른 결과가 와요.",answeredAt:now-2*DAY+52*m,rating:"good"})
